<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div id="city-input">
        <input type="text" id="enterCity" placeholder="Enter city name">
        <button onclick="getWeather()">Get Weather</button>
    </div>

    <div id="todays-weather">
        <p>Today's Weather</p>
        <p id="current-temp"></p>
        <p id="current-description"></p>
    </div>

    <div id="hourly">
        <p>Hourly Weather</p>
        <div id="hourly-forecast"></div>
    </div>

    <div id="daily">
        <p>Daily Weather</p>
        <div id="daily-forecast"></div>
    </div>

    <script>
        const API_KEY = '98f739e0598d2ea5ff75493594b0f8b1';

        // Function to fetch weather data
        async function getWeather() {
            const city = document.getElementById('enterCity').value.trim();
            const getWeatherIconUrl = (iconCode) => `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

            if (!city) {
                alert('Please enter the city you would like to see the weather for.');
                return;
            }

            try {
                // Fetch Today's Weather
                const currentResponse = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`);
                const todaysData = await currentResponse.json();
                displayTodaysWeather(todaysData);

                // Fetch Hourly and Daily Weather
                const forecastResponse = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`);
                const forecastData = await forecastResponse.json();
                displayHourlyForecast(forecastData);
                displayDailyForecast(forecastData);
                
            } catch (error) {
                alert('Error fetching weather data');
            }
        }

        // Display today's weather
        function displayTodaysWeather(data) {
            const temp = data.main.temp;
            const description = data.weather[0].description;
            const icon = getWeatherIconUrl(data.weather[0].icon);
            document.getElementById('current-temp').textContent = `Temperature: ${temp}°C`;
            document.getElementById('current-description').innerHTML = `
            <img src="${icon}" alt="${description}" style="vertical-align: middle;">
            Condition: ${description};
        }

        // Display hourly weather forecast (next 24 hours)
        function displayHourlyForecast(data) {
            const hourlyContainer = document.getElementById('hourly-forecast');
            hourlyContainer.innerHTML = ''; // Clear previous hourly forecast

            // Loop through the forecast data (3-hour intervals)
            data.list.slice(0, 8).forEach(item => {
                const time = new Date(item.dt * 1000).toLocaleTimeString();
                const temp = item.main.temp;
                const description = item.weather[0].description;
                const icon = getWeatherIconUrl(item.weather[0].icon);
                const forecastItem = document.createElement('div');
                forecastItem.innerHTML =  <img src="${icon}" alt="${description}" style="vertical-align: middle; margin-right: 8px;">
                <strong>${time}</strong>: ${temp}°C, ${description};
                hourlyContainer.appendChild(forecastItem);
            });
        }

        // Display daily weather forecast (highs and lows)
        function displayDailyForecast(data) {
            const dailyContainer = document.getElementById('daily-forecast');
            dailyContainer.innerHTML = ''; // Clear previous daily forecast

            // Loop through the daily forecast data
            const days = data.list.filter((item, index) => index % 8 === 0); // 8 data points = 1 day

            days.forEach(item => {
                const date = new Date(item.dt * 1000).toLocaleDateString();
                const highTemp = item.main.temp_max;
                const lowTemp = item.main.temp_min;
                const description = item.weather[0].description;
                const icon = getWeatherIconUrl(item.weather[0].icon);
                const forecastItem = document.createElement('div');
                forecastItem.innerHTML ='<img src="${icon}" alt="${description}" style="vertical-align: middle; margin-right: 8px;">';
                <strong>${date}</strong>: High: ${highTemp}°C, Low: ${lowTemp}°C
            `;
                dailyContainer.appendChild(forecastItem);
            });
        }
    </script>

</body>
</html>
